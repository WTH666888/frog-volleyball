<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

R.domElement.style.position='fixed';R.domElement.style.top='0';R.domElement.style.left='0';
R.domElement.style.zIndex='5';R.domElement.style.pointerEvents='none'; // 默认不拦截点击
const L=new T.DirectionalLight(0xffffff,2.5);L.position.set(8,18,3);L.castShadow=true;L.shadow.mapSize.set(1024,1024);Object.assign(L.shadow.camera,{near:1,far:60,left:-18,right:18,top:13,bottom:-13});S.add(L,new T.AmbientLight(0x6688aa,2.2),new T.HemisphereLight(0x88ccff,0x444422,1.1));
const G=new T.Mesh(new T.PlaneGeometry(50,40),new T.MeshStandardMaterial({color:0x4a8a3f,roughness:0.8}));G.rotation.x=-Math.PI/2;G.receiveShadow=true;S.add(G);
const Court=new T.Mesh(new T.PlaneGeometry(18,24),new T.MeshStandardMaterial({color:0xd4884a,roughness:0.5}));Court.rotation.x=-Math.PI/2;Court.position.y=0.01;Court.receiveShadow=true;S.add(Court);
function Ln(x,z,w,d){const l=new T.Mesh(new T.PlaneGeometry(w,d),new T.MeshBasicMaterial({color:0xffffff,side:T.DoubleSide}));l.rotation.x=-Math.PI/2;l.position.set(x,0.02,z);S.add(l)}
Ln(0,-12,18,0.08);Ln(0,12,18,0.08);Ln(-9,0,0.08,24);Ln(9,0,0.08,24);Ln(0,0,0.06,24);Ln(0,-4,18,0.05);Ln(0,4,18,0.05);
[-9.2,9.2].forEach(x=>{const p=new T.Mesh(new T.CylinderGeometry(0.07,0.07,3.5),new T.MeshStandardMaterial({color:0x999,metalness:0.8}));p.position.set(x,0.75,0);S.add(p)});
S.add(new T.Mesh(new T.PlaneGeometry(18.4,1.5),new T.MeshStandardMaterial({color:0xddd,roughness:1,transparent:true,opacity:0.6,side:T.DoubleSide})).translateY(1.75));
const Ball=new T.Mesh(new T.SphereGeometry(0.25,16,16),new T.MeshStandardMaterial({color:0xffdd44,roughness:0.2}));Ball.castShadow=true;Ball.position.set(0,1.5,0);S.add(Ball);

// ====== 数据 ======
const FC={bouncy:0x44ccff,power:0xff6644,beauty:0xff88cc,speed:0xffdd44,normal:0x88cc88,cheer:0xffaa00,black:0x555,coach:0xeee};
const FN={bouncy:'弹力蛙',power:'大力蛙',beauty:'美女蛙',speed:'速度蛙',normal:'普通蛙',cheer:'加油蛙',black:'黑拳蛙',coach:'教练蛙'};

const NXT={1:6,6:5,5:4,4:3,3:2,2:1};

// ====== 独特青蛙模型 (每种不同外观) ======
function mkF(type,c){
  const g=new T.Group();
  const mat=new T.MeshStandardMaterial({color:c,roughness:0.25});
  const dark=new T.MeshStandardMaterial({color:new T.Color(c).multiplyScalar(0.6),roughness:0.3});

  switch(type){

      break;}
    case'black':{ // 黑拳蛙 - 拳击手套
      g.add(new T.Mesh(new T.SphereGeometry(0.38,12,10),mat).translateY(0.5));
      g.add(new T.Mesh(new T.SphereGeometry(0.24,10,8),mat).translateY(1.05).translateZ(0.02));
      // 红色拳套
      [-0.28,0.28].forEach(s=>{g.add(new T.Mesh(new T.SphereGeometry(0.09,6,5),new T.MeshStandardMaterial({color:0xff2222})).translateX(s).translateY(0.55).translateZ(0.2));});
      break;}
    case'coach':{ // 教练蛙 - 帽子
      g.add(new T.Mesh(new T.SphereGeometry(0.36,12,10),mat).translateY(0.5));
      g.add(new T.Mesh(new T.SphereGeometry(0.24,10,8),mat).translateY(1.05).translateZ(0.02));

      g.add(new T.Mesh(new T.CylinderGeometry(0.12,0.15,0.08,8),new T.MeshStandardMaterial({color:0x334466})).translateY(1.25));

// ====== 青蛙被动 (完整版) ======
function getM(f,isR){
  const idx=pF.indexOf(f),fm=idx>=0?forms[idx]:'attack';
  let ps=38,pe=76,sp=1,lb=FN[f.type];
  // 基础被动
  switch(f.type){
    case'normal':fm==='attack'?pe=78:(ps=33,pe=78);break;
    case'power':fm==='attack'?(ps=48,pe=62,sp=1.3,lb='大力蛙⚔'):(ps=42,pe=68,lb='大力蛙🛡');break;
    case'bouncy':fm==='attack'?(ps=33,pe=80,sp=0.85,lb='弹力蛙⚔'):(ps=25,pe=85,sp=0.7,lb='弹力蛙🛡');break;
    case'speed':sp=fm==='attack'?0.7:0.8;lb='速度蛙';break;
    case'beauty':ps=44;pe=68;sp=1.15;lb='美女蛙';break;
    case'cheer':ps=33;pe=82;sp=0.85;lb='加油蛙';break;
    case'black':ps=38;pe=76;sp=1.1;lb='黑拳蛙';break;
    case'coach':ps=38;pe=78;sp=0.85;lb='教练蛙';break;
  }
  // 糟糕出手惩罚
  if(isR&&!['bouncy','speed','normal'].includes(f.type)){ps+=8;pe-=8;lb+='⚠';}
  // 己方加油蛙: 全队绿区+10%
  if(pF.some(x=>x.type==='cheer')){ps-=4;pe+=4;}
  // 对方美女蛙: 我方绿区-15%
  if(aF.some(x=>x.type==='beauty')){ps+=6;pe-=6;}
  // BUFF修正
  if(buff&&buff.type==='attack'){if(!isR){ps-=3;pe+=5;sp*=0.85;}else{ps+=6;pe-=6;sp*=1.2;}}
  if(buff&&buff.type==='defense'){if(isR){ps-=8;pe+=8;sp*=0.75;}else{ps+=4;pe-=4;sp*=1.4;}}
  return{ps,pe,sp,label:lb};
}

function showRosterScreen(){
  document.getElementById('main-menu').style.display='none';
  document.getElementById('roster-screen').style.display='flex';

  selectedRoster=Array(6).fill(null);
  buildRosterUI();
}

function buildRosterUI(){
  const pool=document.getElementById('roster-pool');pool.innerHTML='';
  const picked=document.getElementById('roster-picked');picked.innerHTML='';
  const filled=selectedRoster.filter(x=>x!==null).length;
  document.getElementById('pick-count').textContent=filled+'/6';

  // 青蛙池
  ALL_FROGS.forEach((f,i)=>{
    const used=selectedRoster.includes(f.type);
    const card=document.createElement('div');
    card.draggable=!used;
    card.style.cssText='width:110px;padding:10px 6px;border-radius:10px;text-align:center;cursor:'+(used?'default':'grab')+';transition:all 0.15s;border:2px solid '+(used?'#444':'#555')+';background:'+(used?'#111':'#1a1a2e')+';opacity:'+(used?'0.4':'1');
    card.innerHTML=`<div style="font-size:26px">${f.icon}</div><div style="color:${used?'#555':f.color};font-weight:bold;font-size:12px;">${f.name}</div><div style="color:#888;font-size:9px;">${f.desc}</div>`;
    card.id='frog-card-'+f.type;
    card.ondragstart=e=>{e.dataTransfer.setData('text/plain',f.type);e.dataTransfer.effectAllowed='move';card.style.opacity='0.5';};
    card.ondragend=e=>{card.style.opacity=used?'0.4':'1';};
    pool.appendChild(card);
  });

  // 6个位置槽
  const posNames=['1号(后排右·发球)','2号(前排右)','3号(前排中)','4号(前排左)','5号(后排左)','6号(后排中)'];
  selectedRoster.forEach((t,i)=>{
    const slot=document.createElement('div');
    slot.style.cssText='width:78px;text-align:center;padding:6px;border-radius:8px;background:'+(t?'#0a2a0a':'rgba(255,255,255,0.02)')+';border:'+(t?'2px solid #0f8':'1px dashed #555')+';transition:all 0.15s;min-height:85px;';
    slot.ondragover=e=>{e.preventDefault();slot.style.borderColor='#ff0';slot.style.background='#1a1a0a';};
    slot.ondragleave=e=>{slot.style.borderColor=t?'#0f8':'#555';slot.style.background=t?'#0a2a0a':'rgba(255,255,255,0.02)';};
    slot.ondrop=e=>{
      e.preventDefault();
      const frogType=e.dataTransfer.getData('text/plain');
      // 如果该青蛙已在其他位置,移除
      const oldIdx=selectedRoster.indexOf(frogType);
      if(oldIdx>=0)selectedRoster[oldIdx]=null;
      // 如果该位置已有青蛙,放回池中
      if(selectedRoster[i]){/* nothing needed, just replace */}
      selectedRoster[i]=frogType;
      buildRosterUI();
    };
    if(t){
      const f=ALL_FROGS.find(x=>x.type===t);
      slot.innerHTML=`<div style="font-size:22px">${f.icon}</div><div style="color:${f.color};font-size:10px;font-weight:bold;">${f.name}</div><div style="color:#aaa;font-size:9px;">${posNames[i]}</div>`;
      slot.onclick=()=>{selectedRoster[i]=null;buildRosterUI();};
    }else{
      slot.innerHTML=`<div style="font-size:22px;color:#444;">❓</div><div style="color:#666;font-size:9px;">${posNames[i]}</div><div style="color:#555;font-size:8px;">拖入青蛙</div>`;
    }
    // 高亮前后排
    if([3,2,1].includes(i))slot.style.borderColor=t?'#0f8':'#48f';
    picked.appendChild(slot);
  });

  const btn=document.getElementById('confirm-btn');
  if(filled===6){btn.disabled=false;btn.style.opacity='1';}
  else{btn.disabled=true;btn.style.opacity='0.5';}
}

function randomRoster(){
  const shuffled=[...ALL_FROGS].sort(()=>Math.random()-0.5);
  selectedRoster=shuffled.slice(0,6).map(f=>f.type);
  buildRosterUI();
}

function confirmRoster(){

  // 更新LINEUP(按位置1→6排列，对应场上1号位到6号位)
  for(let i=0;i<6;i++){LU[i]=selectedRoster[i];}
  crAll();bFB();
  document.getElementById('roster-screen').style.display='none';
  startGameNow();
}

// ====== 动画系统 ======
// 青蛙跳跃动画
function frogJump(f,h=2.5){f.model.userData.anim.jump=1;f.model.userData.anim.jumpH=h;}
function frogSpike(f){f.model.userData.anim.spike=1;}
function frogReceive(f){f.model.userData.anim.receive=1;}

// 更新青蛙动画
function updateFrogAnims(dt){
  [...pF,...aF].forEach(f=>{
    const a=f.model.userData.anim;if(!a)return;
    // 跳跃动画
    if(a.jump>0.01){a.jump-=dt*3;const y=Math.sin(a.jump*Math.PI)*a.jumpH;f.model.position.y=a.baseY+y;if(a.jump<0.05){a.jump=0;f.model.position.y=a.baseY;}}
    // 扣球动画
    if(a.spike>0.01){a.spike-=dt*3.5;f.model.rotation.x=-Math.sin(a.spike*Math.PI)*0.8;if(a.spike<0.05){a.spike=0;f.model.rotation.x=0;}}
    // 接球动画
    if(a.receive>0.01){a.receive-=dt*3;f.model.position.z+=Math.sin(a.receive*Math.PI)*0.3*(f.side==='blue'?1:-1);if(a.receive<0.05){a.receive=0;}}
  });
}

// 球轨迹
let ballTrail=[];
let ballTarget=null,ballAnim=0;

function animateBallTo(tx,ty,tz,dur=0.5){
  ballTarget={x:tx,y:ty,z:tz,fromX:Ball.position.x,fromY:Ball.position.y,fromZ:Ball.position.z,dur,elapsed:0};
}

// ====== 渲染循环 ======
const clock=new T.Clock();let frameSkip=0;
function anim(){
  requestAnimationFrame(anim);
  const dt=Math.min(clock.getDelta(),0.1);const btm=getBTMod();const ts=bt?btm:1;const eDt=dt*ts;

  // 镜头震动衰减
  if(camShake>0.001){C.position.x+=Math.sin(performance.now()*0.05)*camShake;C.position.y+=Math.cos(performance.now()*0.07)*camShake*0.5;camShake*=0.9;}

  // 青蛙动画
  updateFrogAnims(dt);

  // 球动画
  if(ballTarget){
    ballTarget.elapsed+=dt;
    const t=Math.min(1,ballTarget.elapsed/ballTarget.dur);
    const ease=t<0.5?2*t*t:-1+(4-2*t)*t;
    Ball.position.set(
      ballTarget.fromX+(ballTarget.x-ballTarget.fromX)*ease,
      ballTarget.fromY+(ballTarget.y-ballTarget.fromY)*ease+Math.sin(t*Math.PI)*3,
      ballTarget.fromZ+(ballTarget.z-ballTarget.fromZ)*ease
    );
    // 球轨迹
    ballTrail.push({x:Ball.position.x,y:Ball.position.y,z:Ball.position.z,life:1});
    if(t>=1)ballTarget=null;
  }
  // 轨迹衰减
  ballTrail=ballTrail.filter(p=>{p.life-=dt*2;return p.life>0;});

  if(qOn){qV+=qD*qSP*160*eDt;if(qV>=100){qV=100;qD=-1}if(qV<=0){qV=0;qD=1}const f=document.getElementById('qte-f');if(f){f.style.width=qV+'%';f.style.background=(qV>=qPS&&qV<=qPE)?'linear-gradient(90deg,#0a4,#0f8,#0a4)':(qV>=qPS-14&&qV<=qPE+10)?'linear-gradient(90deg,#c60,#fa0,#c60)':'linear-gradient(90deg,#c00,#f44,#c00)';}}

  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.position.x+=p.userData.vx*dt;p.position.y+=p.userData.vy*dt;p.position.z+=p.userData.vz*dt;p.userData.vy-=4*dt;p.userData.life-=p.userData.decay;p.material.opacity=Math.max(0,p.userData.life);if(p.userData.life<=0){S.remove(p);pts.splice(i,1);}}

  S.fog.density=bt?0.02:0.005;R.toneMappingExposure=bt?0.7:1.2;
  ctrl.update();R.render(S,C);
}
