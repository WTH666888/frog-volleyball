let firebaseDB = null; // 跨设备排行榜 + 联机用

// ===== 数据库 (localStorage + Firebase) =====
let playerName = localStorage.getItem('fv_name') || '';
let matchHistory = JSON.parse(localStorage.getItem('fv_history') || '[]');
let leaderboard = JSON.parse(localStorage.getItem('fv_leaderboard') || '[]');

function saveDB() {
  localStorage.setItem('fv_name', playerName);
  localStorage.setItem('fv_history', JSON.stringify(matchHistory.slice(-50)));
  localStorage.setItem('fv_leaderboard', JSON.stringify(leaderboard.slice(0, 20)));
}

function addMatchRecord(result, myScore, aiScore) {
  matchHistory.push({
    date: new Date().toLocaleDateString(),
    time: new Date().toLocaleTimeString().slice(0,5),
    result, myScore, aiScore, difficulty: aiDiff
  });
  // 更新排行榜
  const existing = leaderboard.find(e => e.name === playerName);
  const points = result === 'win' ? 3 : (result === 'lose' ? 1 : 0);
  if (existing) {
    existing.games++; existing.wins += result === 'win' ? 1 : 0;
    existing.losses += result === 'lose' ? 1 : 0;
    existing.points = existing.wins * 3 + existing.losses;
  } else if (playerName) {
    leaderboard.push({
      name: playerName, games: 1,
      wins: result === 'win' ? 1 : 0,
      losses: result === 'lose' ? 1 : 0,
      points: points
    });
  }
  leaderboard.sort((a,b) => b.points - a.points);
  saveDB();
  showRanking();
}

function showRanking() {
  const div = document.getElementById('rank-list');
  div.style.display = 'block';
  if (leaderboard.length === 0) {
    div.innerHTML = '<div style="color:#888;">暂无数据</div>';
    return;
  }
  div.innerHTML = leaderboard.map((e,i) =>
    `<div style="color:${i===0?'#ffdd00':i===1?'#ccc':i===2?'#c96':'#888'};font-size:10px;padding:1px 0;">
      ${i+1}. ${e.name} ${e.wins}胜${e.losses}负 (${e.points}分)
    </div>`
  ).join('');
}

// ===== 新手教程 =====
const tutorialSteps = [
  {emoji:'🐸',title:'欢迎来到青蛙排球!',text:'这是一款指令选择 + QTE时机的排球博弈游戏。<br>你操控6只不同特性的青蛙，与AI对手进行3v3排球对决（前排3只+后排3只）。'},
  {emoji:'🖱',title:'如何操作',text:'<b>鼠标点击</b>场上带绿圈的青蛙来选择它。<br><b>空格键</b>执行QTE判定（蓄力条在底部显示）。<br><b>鼠标拖拽</b>旋转3D视角，<b>滚轮</b>缩放。'},
  {emoji:'🏐',title:'游戏流程',text:'<b>发球</b>→ 按空格蓄力 →<br><b>AI接球</b>→ AI进攻 →<br><b>你拦网</b>→ 点击前排青蛙(可多选1~3只)→ 空格确认 →<br><b>你进攻</b>→ 点击前排青蛙扣球 → 空格QTE → <b>得分!</b>'},
  {emoji:'📊',title:'QTE蓄力条',text:'底部会出现一根来回摆动的蓄力条。<br><span style="color:#0f8;">绿色区域</span> = 完美 → 得分!<br><span style="color:#fa0;">橙色区域</span> = 普通 → 成功<br><span style="color:#f44;">红色区域</span> = 失误 → 丢分<br>在绿色区域按空格! '},
  {emoji:'🐸',title:'8种青蛙',text:'每只青蛙有独特的QTE参数!<br><span style="color:#4cf;">弹力蛙</span>: 绿区超宽(25-85%)，防守专家<br><span style="color:#f64;">大力蛙</span>: 绿区窄(48-62%)，扣球威力大<br><span style="color:#fd4;">速度蛙</span>: 指针最慢，容易命中<br>底部按钮可切换每只青蛙的⚔攻/🛡守形态! '},
  {emoji:'🎯',title:'三种战术 (按1/2/3)',text:'<b>1键 全力扣球</b>: 标准QTE扣球<br><b>2键 轻吊球</b>: 无需QTE,自动得分<br><b>3键 假扣真传</b>: 骗对方起跳后轻吊'},
  {emoji:'🏆',title:'准备好了吗?',text:'25分制,领先2分获胜,三局两胜!<br>按 <b>T</b> 暂停 | 按 <b>R</b> 重置<br>祝你玩得开心! 🐸🏐'},
];
let tutStep = 0;
function showTutorial(step) {
  tutStep = step;
  const s = tutorialSteps[step];
  document.getElementById('tut-emoji').textContent = s.emoji;
  document.getElementById('tut-title').textContent = s.title;
  document.getElementById('tut-text').innerHTML = s.text;
  document.getElementById('tut-prev').style.display = step === 0 ? 'none' : 'inline-block';
  document.getElementById('tut-next').textContent = step >= tutorialSteps.length - 1 ? '🎮 开始游戏!' : '下一步 →';
  document.getElementById('tutorial-overlay').style.display = 'flex';
}
function hideTutorial() {
  document.getElementById('tutorial-overlay').style.display = 'none';
}
document.getElementById('tut-prev').addEventListener('click', ()=>{ if(tutStep>0) showTutorial(tutStep-1); });
document.getElementById('tut-next').addEventListener('click', ()=>{ if(tutStep<tutorialSteps.length-1) showTutorial(tutStep+1); else hideTutorial(); });
document.getElementById('tut-skip').addEventListener('click', hideTutorial);
// 首次打开自动显示教程
if (!localStorage.getItem('fv_tutorial_done')) {
  setTimeout(()=>showTutorial(0), 500);
  localStorage.setItem('fv_tutorial_done', '1');
}

// ===== 联机对战 (PeerJS WebRTC) =====
let peer = null, peerConn = null, peerId = '', remotePeerId = '';
let isMultiplayer = false, isHost = false;
let multiState = {};

function initMultiplayer() {
  const script = document.createElement('script');
  script.src = 'https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js';
  script.onload = () => {
    peer = new Peer();
    peer.on('open', (id) => {
      peerId = id;
      log('🟢 联机就绪! 你的ID: '+id.slice(0,8), 'p');
      document.getElementById('peer-id-display').textContent = '我的ID: '+id.slice(0,8)+'...';
    });
    peer.on('connection', (conn) => {
      peerConn = conn;
      setupPeerConnection(conn);
      log('🔗 对手已连接!', 'p');
      document.getElementById('multi-status').textContent = '🟢 已连接';
    });
    peer.on('error', (e) => { log('联机错误: '+e.type, 'm'); });
  };
  document.head.appendChild(script);
}

function setupPeerConnection(conn) {
  conn.on('data', (data) => {
    if (data.type === 'score') {
      // 对手得分同步
      if (data.team === 'red' && !isHost) { sc.red = data.scRed; updUI(); }
      if (data.team === 'blue' && isHost) { sc.blue = data.scBlue; updUI(); }
    }
    if (data.type === 'gameState') {
      multiState = data.state;
    }
  });
  conn.on('close', () => {
    log('对手断开连接', 'm');
    document.getElementById('multi-status').textContent = '🔴 已断开';
    isMultiplayer = false;
  });
}

function hostRoom() {
  if (!peer) initMultiplayer();
  isHost = true; isMultiplayer = true;
  log('🏠 创建房间中... 等待对手加入', 'p');
  document.getElementById('multi-status').textContent = '🏠 等待对手...';
}
function joinRoom(hostId) {
  if (!peer) initMultiplayer();
  isHost = false; isMultiplayer = true;
  setTimeout(() => {
    if (!peer) return;
    peerConn = peer.connect(hostId);
    setupPeerConnection(peerConn);
    log('🔗 加入房间...', 'p');
    document.getElementById('multi-status').textContent = '🔗 连接中...';
  }, 1000);
}
function sendToPeer(data) {
  if (peerConn && peerConn.open) peerConn.send(data);
}

// 在得分时同步
const origAward = award;
award = function(team) {
  origAward(team);
  if (isMultiplayer) sendToPeer({type:'score', team, scRed: sc.red, scBlue: sc.blue});
};

// ===== 场景 =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a5a3a);
scene.fog = new THREE.Fog(0x3a5a3a, 30, 80);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 120);
camera.position.set(0, 17, 14); camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 灯光
const dir = new THREE.DirectionalLight(0xffffff, 3);
dir.position.set(10, 20, 5); dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
Object.assign(dir.shadow.camera, {near:1,far:60,left:-20,right:20,top:15,bottom:-15});
scene.add(dir, new THREE.AmbientLight(0x6688aa, 2), new THREE.HemisphereLight(0x88ccff, 0x444422, 1));

// 地面
const ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 40), new THREE.MeshStandardMaterial({color:0x4a8a3f,roughness:0.8}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// 球场
const court = new THREE.Mesh(new THREE.PlaneGeometry(18, 24), new THREE.MeshStandardMaterial({color:0xd4884a,roughness:0.5}));
court.rotation.x = -Math.PI/2; court.position.y = 0.01; court.receiveShadow = true; scene.add(court);

addLine(0,-12,18,0.1);addLine(0,12,18,0.1);addLine(-9,0,0.1,24);addLine(9,0,0.1,24);addLine(0,0,0.08,24); // 中线

[-9.2,9.2].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,3.5),new THREE.MeshStandardMaterial({color:0x999,metalness:0.8}));p.position.set(x,0.75,0);scene.add(p);});

// ===== 青蛙数据 =====
const C = {bouncy:0x44ccff,power:0xff6644,beauty:0xff88cc,speed:0xffdd44,normal:0x88cc88,cheer:0xffaa00,black:0x555,coach:0xeee};
const N = {bouncy:'弹力蛙',power:'大力蛙',beauty:'美女蛙',speed:'速度蛙',normal:'普通蛙',cheer:'加油蛙',black:'黑拳蛙',coach:'教练蛙'};
const LINEUP = ['bouncy','power','beauty','speed','normal','cheer'];
const NEXT = {1:6,6:5,5:4,4:3,3:2,2:1};

// ===== 创建青蛙 =====
function makeFrog(color){
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({color,roughness:0.25});
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.4,16,12), m);
  b.position.y=0.5;b.castShadow=true;g.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.26,12,8), m);
  h.position.set(0,1.05,0.05);h.castShadow=true;g.add(h);
  // 眼睛
  const eG=new THREE.SphereGeometry(0.08,6,6),eM=new THREE.MeshBasicMaterial({color:0xffffff});
  const pG=new THREE.SphereGeometry(0.05,4,4),pM=new THREE.MeshBasicMaterial({color:0x000000});
  [-0.13,0.13].forEach(s=>{
    const e=new THREE.Mesh(eG,eM);e.position.set(s,1.14,0.2);g.add(e);
    const p=new THREE.Mesh(pG,pM);p.position.set(s,1.14,0.26);g.add(p);
  });
  // 光环
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.48,0.55,24),new THREE.MeshBasicMaterial({color:0x00ff88,side:THREE.DoubleSide,visible:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=0.02;g.add(ring);g.userData.ring=ring;
  return g;
}

// 标准6个排球位置
const POSITIONS = [
  {id:4,x:-6,z:2.5,front:true},{id:3,x:0,z:2.5,front:true},{id:2,x:6,z:2.5,front:true},
  {id:5,x:-6,z:7,front:false},{id:6,x:0,z:7,front:false},{id:1,x:6,z:7,front:false}
];

const playerFrogs=[],aiFrogs=[];
function createAllFrogs(){
  [...playerFrogs,...aiFrogs].forEach(f=>scene.remove(f.model));
  playerFrogs.length=0;aiFrogs.length=0;
  // 蓝队
  POSITIONS.forEach((p,i)=>{
    const t=LINEUP[i];
    const md=makeFrog(C[t]);md.position.set(p.x,0,p.z);md.scale.set(1.5,1.5,1.5);scene.add(md);
    playerFrogs.push({model:md,posId:p.id,type:t,front:p.front,x:p.x,z:p.z,selectable:false,side:'blue'});
  });
  // 红队
  POSITIONS.forEach((p,i)=>{
    const md=makeFrog(0x88cc88);md.position.set(p.x,0,-p.z);md.rotation.y=Math.PI;md.scale.set(1.5,1.5,1.5);scene.add(md);
    aiFrogs.push({model:md,posId:p.id,type:'normal',front:p.front,x:p.x,z:-p.z,selectable:false,side:'red'});
  });
  log('✅ 蓝队'+playerFrogs.length+'只 + 红队'+aiFrogs.length+'只 = '+(playerFrogs.length+aiFrogs.length)+'只','p');
}
function initFrogs(){createAllFrogs();}
initFrogs();

  document.getElementById('ss').textContent=sets.blue+'-'+sets.red;
}

// ===== 音效 =====
let actx;
function au(){if(!actx)actx=new AudioContext();if(actx.state==='suspended')actx.resume();return actx;}
function beep(f,d,v=0.08){const c=au();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
function sfxP(){beep(880,0.1);setTimeout(()=>beep(1100,0.15),80);}
function sfxS(){beep(523,0.08);setTimeout(()=>beep(659,0.08),70);setTimeout(()=>beep(784,0.12),140);}
function sfxM(){beep(120,0.3);}

// ===== 日志 =====
function log(msg,c=''){
  const d=document.createElement('div');d.style.color=c==='p'?'#0f8':c==='m'?'#f44':'#aaa';d.textContent=msg;
  const box=document.getElementById('log');box.prepend(d);
  if(box.children.length>15)box.removeChild(box.lastChild);
}

// ===== QTE =====
function startQTE(cb,label,mod={ps:38,pe:76,sp:1}){
  qteOn=true;qteVal=0;qteDir=1;qteCB=cb;
  qtePS=mod.ps||38;qtePE=mod.pe||76;qteSP=mod.sp||1;
  document.getElementById('hint').textContent='␣ '+label;
  document.getElementById('hint').style.color='#ffaa00';
  document.getElementById('qte-bar').style.display='block';
  document.getElementById('qte-perfect').style.left=qtePS+'%';
  document.getElementById('qte-perfect').style.width=(qtePE-qtePS)+'%';
  document.getElementById('qte-label').textContent='␣ '+label+(mod.label?' ['+mod.label+']':'');
}
function stopQTE(){qteOn=false;document.getElementById('hint').style.color='#fff';document.getElementById('qte-bar').style.display='none';}
function fireQTE(){if(!qteOn)return;const v=qteVal;stopQTE();const r=(v>=qtePS&&v<=qtePE)?'perfect':(v>=qtePS-14&&v<=qtePE+10)?'normal':'miss';if(qteCB)qteCB(r);}

// ===== 青蛙被动QTE =====
function getMod(frog,isRecv){
  const idx=playerFrogs.indexOf(frog);
  const form=idx>=0?forms[idx]:'attack';
  let ps=38,pe=76,sp=1,label=N[frog.type];
  switch(frog.type){
    case 'normal':if(form==='attack')pe=78;else{ps=33;pe=78;}break;
    case 'power':if(form==='attack'){ps=48;pe=62;sp=1.3;label='大力蛙⚔';}else{ps=42;pe=68;label='大力蛙🛡';}break;
    case 'bouncy':if(form==='attack'){ps=33;pe=80;sp=0.85;label='弹力蛙⚔';}else{ps=25;pe=85;sp=0.7;label='弹力蛙🛡';}break;
    case 'speed':sp=form==='attack'?0.7:0.8;label='速度蛙';break;
    case 'beauty':ps=44;pe=68;sp=1.15;label='美女蛙';break;
    case 'cheer':ps=33;pe=82;sp=0.85;label='加油蛙';break;
    case 'black':ps=38;pe=76;sp=1.1;label='黑拳蛙';break;
    case 'coach':ps=38;pe=78;sp=0.85;label='教练蛙';break;
  }
  if(isRecv&&!['bouncy','speed','normal'].includes(frog.type)){ps+=8;pe-=8;label+='⚠';}
  if(buff&&buff.type==='attack'){if(!isRecv){ps-=3;pe+=5;sp*=0.85;}else{ps+=6;pe-=6;sp*=1.2;}}
  return{ps,pe,sp,label};
}

// ===== 粒子 =====
function spawnParts(x,y,z,color,n=20){
  for(let i=0;i<n;i++){
    const g=new THREE.SphereGeometry(0.05,4,4),m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1});
    const p=new THREE.Mesh(g,m);p.position.set(x,y,z);
    p.userData={vx:(Math.random()-0.5)*3,vy:Math.random()*4+2,vz:(Math.random()-0.5)*3,life:1,decay:0.02+Math.random()*0.03};
    scene.add(p);particles.push(p);
  }
}

// ===== 得分 =====
function award(team){
  sc[team]++;updUI();
  if(sc[team]>=25&&sc[team]-sc[team==='blue'?'red':'blue']>=2)winSet(team);
  serving=team;
  if(buff){buff.turns--;if(buff.turns<=0){buff=null;log('士气BUFF过期');}}
}
function winSet(team){
  sets[team]++;beep(880,0.3);setTimeout(()=>beep(1100,0.5),200);
  log((team==='blue'?'你':'AI')+'赢得第'+curSet+'局!','p');
  if(sets[team]>=2){
    matchOver=true;
    document.getElementById('hint').textContent=team==='blue'?'🏆 你赢了! 按R重来':'💔 AI获胜 按R重来';
    // 保存比赛记录
    if(playerName) addMatchRecord(team==='blue'?'win':'lose', sc.blue, sc.red);
  }
  else{curSet++;sc={blue:0,red:0};updUI();log('交换场地,第'+curSet+'局开始');}
}

// ===== 轮转 =====
function rotate(team){
  // 固定的6个排球位置
  const POSITIONS = [
    {id:4,x:-6,z:2.5,front:true},{id:3,x:0,z:2.5,front:true},{id:2,x:6,z:2.5,front:true},
    {id:5,x:-6,z:7,front:false},{id:6,x:0,z:7,front:false},{id:1,x:6,z:7,front:false}
  ];
  const side = team[0].side==='blue'?1:-1;

  // 更新posId（顺时针轮转）
  team.forEach(f=>{ f.posId = NEXT[f.posId]; });

  // 把每只青蛙放到正确的posId位置
  team.forEach(f=>{
    const pos = POSITIONS.find(p=>p.id===f.posId);
    if(!pos){log('❌无效posId:'+f.posId,'m');return;}
    f.front = pos.front;
    f.x = pos.x;
    f.z = pos.z * side;
    f.model.position.set(f.x, 0, f.z);
  });

  // 验证
  const posSet = new Set();
  team.forEach(f=>{
    const key = f.posId;
    if(posSet.has(key)){log('❌重复posId:'+key,'m');}
    posSet.add(key);
  });
}

// ===== 选中 =====
function clearSel(){playerFrogs.forEach(f=>{f.selectable=false;if(f.model.userData.ring)f.model.userData.ring.visible=false;});}
function highlight(onlyFront){
  playerFrogs.forEach(f=>{
    f.selectable=onlyFront===null?true:(f.front===onlyFront);
    const r=f.model.userData.ring;if(!r)return;
    r.visible=f.selectable;r.material.color.set(f.selectable?0x00ff88:0x444444);
  });
}

// ===== 流程 =====
function resetRound(){
  state='idle';bulletTime=false;clearSel();blockers=[];touchCount=0;
  ball.position.set(0,1.5,0);updUI();
  if(!matchOver){
    document.getElementById('hint').textContent=serving==='blue'?'你的发球局(空格发球)':'AI发球局';
    if(serving!=='blue')setTimeout(aiServe,1200);
  }
}

function startServe(){
  if(state!=='idle'||matchOver)return;
  au();state='serving';touchCount=0;
  startQTE(r=>{
    if(r==='perfect'||r==='normal'){
      sfxS();ball.position.set(playerFrogs.find(f=>f.posId===1).model.position.x,2,playerFrogs.find(f=>f.posId===1).model.position.z);
      state='aiTurn';document.getElementById('hint').textContent='AI接球中...';
      setTimeout(aiPlay,1500);
    }else{sfxM();award('red');resetRound();}
  },'发球蓄力');
}

function aiServe(){
  if(state!=='idle'||matchOver)return;
  state='serving';touchCount=0;
  setTimeout(()=>{
    if(Math.random()<0.12){award('blue');rotate(playerFrogs);resetRound();}
    else{
      state='receive';bulletTime=true;touchCount=1;
      highlight(false);document.getElementById('hint').textContent='🎯 点后排蛙接一传!';
      setTimeout(()=>{if(state==='receive'){award('red');bulletTime=false;clearSel();resetRound();}},4000);
    }
  },1000);
}

function aiPlay(){
  if(Math.random()<0.15){award('blue');rotate(playerFrogs);resetRound();}
  else{
    state='block';bulletTime=true;blockers=[];
    highlight(true);document.getElementById('hint').textContent='选前排蛙拦网(可多选,空格确认)';
    setTimeout(()=>{if(state==='block'){if(blockers.length>0)doBlock();else{award('red');bulletTime=false;clearSel();resetRound();}}},4000);
  }
}

// ===== 玩家操作 =====
function doReceive(frog){
  if(state!=='receive'||frog.front)return;
  clearSel();bulletTime=false;touchCount=2;
  const mod=getMod(frog,true);
  startQTE(r=>{
    if(r==='perfect'){sfxP();spawnParts(frog.model.position.x,1.5,frog.model.position.z,0x00ff88,15);morale.blue=Math.min(100,morale.blue+15);morale.red=Math.max(0,morale.red-5);log('完美一传!','p');}
    else if(r==='normal'){beep(440,0.08);morale.blue=Math.min(100,morale.blue+5);log('一传成功');}
    else{sfxM();award('red');resetRound();return;}
    state='set';bulletTime=true;highlight(null);
    document.getElementById('hint').textContent='✋ 选任意蛙做二传';
    setTimeout(()=>{if(state==='set')doSet(playerFrogs[1]);},3000);
  },'一传接球',mod);
}

function doSet(frog){
  if(state!=='set')return;
  clearSel();bulletTime=false;touchCount=3;
  beep(350,0.08);log(N[frog.type]+' 二传!');
  setTimeout(()=>{
    state='attack';bulletTime=true;highlight(true);
    document.getElementById('hint').textContent='💥 选前排蛙扣球';
    setTimeout(()=>{if(state==='attack'){award('red');bulletTime=false;clearSel();resetRound();}},3500);
  },500);
}

function doSpike(frog){
  if(state!=='attack'||!frog.front)return;
  clearSel();bulletTime=false;
  if(tactic==='tip'){sfxS();spawnParts(frog.model.position.x,2,frog.model.position.z-2,0xffaa00,10);log('🪶轻吊得分!','p');award('blue');rotate(playerFrogs);resetRound();return;}
  // AI拦网
  const cfg={easy:{b:0.15,p:0.2},normal:{b:0.35,p:0.35},hard:{b:0.55,p:0.45}};
  const c=cfg[aiDiff];
  if(Math.random()<c.b){if(Math.random()<c.p){sfxM();log('AI完美拦网!','m');award('red');resetRound();}else{sfxP();log('AI拦网撑起');bulletTime=true;highlight(true);document.getElementById('hint').textContent='AI拦网!再选蛙扣球';}return;}
  const mod=getMod(frog,false);
  startQTE(r=>{
    if(r==='perfect'){sfxS();spawnParts(frog.model.position.x,2.5,frog.model.position.z-3,0xffaa00,25);morale.blue=Math.min(100,morale.blue+25);log('💥完美扣球!','p');award('blue');rotate(playerFrogs);}
    else if(r==='normal'){sfxS();morale.blue=Math.min(100,morale.blue+10);log('扣球得分!','p');award('blue');rotate(playerFrogs);}
    else{sfxM();log('扣球失误','m');award('red');}
    updUI();resetRound();
  },'扣球!',mod);
}

function doBlock(){
  clearSel();bulletTime=false;
  const frog=blockers[0];
  const mod=frog?getMod(frog,false):{ps:38,pe:76,sp:1,label:'拦网'};
  startQTE(r=>{
    if(r==='perfect'){sfxS();if(frog)spawnParts(frog.model.position.x,2,frog.model.position.z,0x00ff88,25);morale.blue=Math.min(100,morale.blue+20+blockers.length*5);log('🛡完美拦网!','p');award('blue');rotate(playerFrogs);resetRound();}
    else if(r==='normal'){sfxP();morale.blue=Math.min(100,morale.blue+8);log('拦网撑起!转入进攻');state='attack';bulletTime=true;highlight(true);document.getElementById('hint').textContent='拦网撑起!选蛙扣球';}
    else{sfxM();log('拦网失败','m');award('red');resetRound();}
    blockers=[];
  },'拦网('+blockers.length+'人)!',mod);
}

// ===== 点击 =====
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects([...playerFrogs,...aiFrogs].map(f=>f.model),true);
  if(!hits.length)return;
  let obj=hits[0].object;while(obj&&!obj.isGroup)obj=obj.parent;
  const frog=[...playerFrogs,...aiFrogs].find(f=>f.model===obj);
  if(!frog||!frog.selectable||frog.side!=='blue')return;
  if(state==='receive')doReceive(frog);
  else if(state==='set')doSet(frog);
  else if(state==='block'){
    const idx=blockers.indexOf(frog);
    if(idx>=0){blockers.splice(idx,1);frog.model.userData.ring.material.color.set(0x00ff88);}
    else if(blockers.length<3){blockers.push(frog);frog.model.userData.ring.material.color.set(0xff6600);}
    document.getElementById('hint').textContent='已选'+blockers.length+'只拦网蛙,空格确认(最多3只)';
  }else if(state==='attack')doSpike(frog);
});

// ===== 键盘 =====
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();au();
    if(qteOn)fireQTE();
    else if(state==='block'&&blockers.length>0)doBlock();
    else if(state==='idle'&&serving==='blue')startServe();
  }
  if(e.code==='KeyR'){createAllFrogs();sc={blue:0,red:0};sets={blue:0,red:0};curSet=1;matchOver=false;buff=null;timeouts={blue:2,red:2};morale={blue:0,red:0};resetRound();buildFormBtns();}
  if(e.code==='Digit1'){tactic='power';document.getElementById('btnT').textContent='💥全力';document.getElementById('btnT').style.background='#960';}
  if(e.code==='Digit2'){tactic='tip';document.getElementById('btnT').textContent='🪶轻吊';document.getElementById('btnT').style.background='#690';}
  if(e.code==='Digit3'){tactic='fake';document.getElementById('btnT').textContent='🎭假扣真传';document.getElementById('btnT').style.background='#609';}
});

// ===== 按钮 =====
document.getElementById('btnS').addEventListener('click',startServe);
document.getElementById('btnR').addEventListener('click',()=>{createAllFrogs();sc={blue:0,red:0};sets={blue:0,red:0};curSet=1;matchOver=false;buff=null;timeouts={blue:2,red:2};morale={blue:0,red:0};resetRound();buildFormBtns();});
document.getElementById('btnT').addEventListener('click',()=>{
  const t=['power','tip','fake'],i=t.indexOf(tactic);tactic=t[(i+1)%3];
  document.getElementById('btnT').textContent={power:'💥全力',tip:'🪶轻吊',fake:'🎭假扣真传'}[tactic];
  document.getElementById('btnT').style.background={power:'#960',tip:'#690',fake:'#609'}[tactic];
});
document.getElementById('btnB').addEventListener('click',()=>{
  if(morale.blue<100){log('士气不足');return;}
  morale.blue=0;buff={type:'attack',turns:3};log('🔥进攻狂潮!','p');sfxS();spawnParts(0,2,5,0xff6600,30);
});
document.getElementById('btnP').addEventListener('click',()=>{
  if(state!=='idle'||serving!=='blue'){log('只能己方发球前暂停');return;}
  if(timeouts.blue<=0){log('暂停次数用完');return;}
  timeouts.blue--;log('⏸暂停('+timeouts.blue+'次)','p');
  document.getElementById('hint').textContent='⏸暂停中...';
  setTimeout(()=>document.getElementById('hint').textContent='暂停结束',3000);
});
document.getElementById('selAI').addEventListener('change',e=>{
  aiDiff=e.target.value;
  const types={easy:['normal','normal','normal','normal','normal','normal'],normal:['bouncy','power','normal','speed','normal','normal'],hard:['bouncy','power','beauty','speed','normal','cheer']};
  aiFrogs.forEach((f,i)=>{f.type=types[aiDiff][i]||'normal';});
  log('AI难度:'+(aiDiff==='easy'?'简单':aiDiff==='normal'?'普通':'困难'));
});
document.getElementById('slBullet').addEventListener('input',e=>{bulletSpeed=[0.05,0.1,0.15,0.25][parseInt(e.target.value)-1];});

function toggleForm(idx){forms[idx]=forms[idx]==='attack'?'defense':'attack';log(N[playerFrogs[idx].type]+'→'+(forms[idx]==='attack'?'⚔攻':'🛡守'));}
function buildFormBtns(){
  const div=document.getElementById('formBtns');div.innerHTML='';
  LINEUP.forEach((t,i)=>{
    const b=document.createElement('button');
    b.style.cssText='padding:2px 6px;border:none;border-radius:3px;font-size:9px;cursor:pointer;color:#fff';
    b.style.background=forms[i]==='attack'?'#611':'#116';
    b.textContent=(i+1)+(forms[i]==='attack'?'⚔':'🛡');b.title=N[t];
    b.addEventListener('click',()=>{toggleForm(i);buildFormBtns();});
    div.appendChild(b);
  });
}
buildFormBtns();

// ===== 玩家名 & 排行榜 =====
document.getElementById('save-name').addEventListener('click', ()=>{
  const input = document.getElementById('player-name');
  playerName = input.value.trim() || '玩家'+Math.floor(Math.random()*1000);
  input.value = playerName;
  saveDB(); showRanking();
  log('昵称已保存: '+playerName, 'p');
});
document.getElementById('show-rank').addEventListener('click', showRanking);
if (playerName) document.getElementById('player-name').value = playerName;
showRanking();

// ===== 相机 =====
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1,0);controls.enableDamping=true;controls.update();

// ===== 渲染循环 =====
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1),ts=bulletTime?bulletSpeed:1;

  if(qteOn){
    qteVal+=qteDir*qteSP*160*dt*ts;
    if(qteVal>=100){qteVal=100;qteDir=-1}if(qteVal<=0){qteVal=0;qteDir=1}
    const fill=document.getElementById('qte-fill');if(fill){
      fill.style.width=qteVal+'%';
      fill.style.background=(qteVal>=qtePS&&qteVal<=qtePE)?'linear-gradient(90deg,#0a4,#0f8,#0a4)':(qteVal>=qtePS-14&&qteVal<=qtePE+10)?'linear-gradient(90deg,#c60,#fa0,#c60)':'linear-gradient(90deg,#c00,#f44,#c00)';
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.position.x+=p.userData.vx*dt;p.position.y+=p.userData.vy*dt;p.position.z+=p.userData.vz*dt;
    p.userData.vy-=5*dt;p.userData.life-=p.userData.decay;p.material.opacity=Math.max(0,p.userData.life);
    if(p.userData.life<=0){scene.remove(p);particles.splice(i,1);}
  }

  scene.fog.density=bulletTime?0.02:0.005;
  renderer.toneMappingExposure=bulletTime?0.7:1.2;
  controls.update();
  renderer.render(scene,camera);
}
animate();
document.getElementById('hint').textContent='按空格发球 | 123切换战术';
log('🐸 青蛙排球就绪! 蓝队'+playerFrogs.length+'只 红队'+aiFrogs.length+'只');
</script>
